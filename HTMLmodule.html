<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المستندات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f7f6;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }
        .file-btn {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #2ecc71;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .file-btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
    </style>
    <script>
        // دالة تقوم بإنشاء رابط مستعرض مايكروسوفت تلقائياً بناءً على رابط موقعك الحالي
        function openWord(fileName) {
            var currentUrl = window.location.href.split('?')[0].split('#')[0];
            // إذا كان الرابط ينتهي بـ index.html نقوم بإزالته للحصول على المسار الأساسي
            if(currentUrl.endsWith('index.html')) {
                currentUrl = currentUrl.replace('index.html', '');
            }
            if(!currentUrl.endsWith('/')) {
                currentUrl += '/';
            }
            var fileUrl = currentUrl + fileName;
            var officeUrl = "https://live.com" + encodeURIComponent(fileUrl);
            window.open(officeUrl, '_blank');
        }
    </script>
</head>
<body>

    <h1>اضغط لعرض المستند مباشرة</h1>

    <div class="container">
        <!-- عند الضغط على الزر سيفتح الملف أونلاين عبر مستعرض مايكروسوفت -->
        <a href="javascript:void(0)" onclick="openWord('ALLNOm.docx')" class="file-btn">ALLNOm</a>
        <a href="javascript:void(0)" onclick="openWord('ALLUPD.docx')" class="file-btn">ALLUPD</a>
        <a href="javascript:void(0)" onclick="openWord('CSTOPNorm.docx')" class="file-btn">CSTOPNorm</a>
        <a href="javascript:void(0)" onclick="openWord('LeaderOPNorm.docx')" class="file-btn">LeaderOPNorm</a>
        <a href="javascript:void(0)" onclick="openWord('LeaderTSNorm.docx')" class="file-btn">LeaderTSNorm</a>
        <a href="javascript:void(0)" onclick="openWord('RETAILRPNorm.docx')" class="file-btn">RETAILRPNorm</a>
        <a href="javascript:void(0)" onclick="openWord('RETCSTFINNorm.docx')" class="file-btn">RETCSTFINNorm</a>
    </div>

</body>
</html>
